name: Nightly Regression
on:
  schedule:
    # run at 14:33 UTC (22:33 UTC+8)
    - cron: '33 14 * * *'

env:
  NIGHTLY_HOME: /nfs/home/ci-runner/xsai-nightly/${{ github.run_number }}
  EMU_HOME: /nfs/home/ci-runner/xsai-nightly/${{ github.run_number }}/default-matrix
  FUZZ_NUM: 4 # per json file
  CKPT_BASE: /nfs/home/share/checkpoints_profiles
  PROFILE_PATH: /nfs/home/share/ci-workloads/env-scripts/perf_trigger/profile/data
  ETA_THRESHOLD: 30000
  SCRIPTS_HOME: /nfs/home/share/ci-workloads/env-scripts
  SERVER_LIST: all

jobs:
  build-default-matrix:
    runs-on: [bosc, node]
    continue-on-error: false
    timeout-minutes: 360
    name: Build DefaultMatrixConfig EMU
    steps:
      - name: Cleanup orphan EMU
        run: |
          pkill -9 -e -f "${GITHUB_WORKSPACE}/build/emu" || true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: set env
        run: |
          echo "NOOP_HOME=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "NEMU_HOME=/nfs/home/share/ci-workloads/NEMU" >> $GITHUB_ENV
      - name: Initialize submodules
        run: make init-force
      - name: clean up
        run: |
          python3 $GITHUB_WORKSPACE/scripts/xiangshan.py --clean
      - name: Build EMU with DRAMsim3 and NEMU-Diff
        run: |
          sed -i \
            -e 's/--output-split 30000/--output-split 5000/' \
            -e 's/--output-split-cfuncs 30000/--output-split-cfuncs 5000/' \
            $GITHUB_WORKSPACE/difftest/verilator.mk
          python3 $GITHUB_WORKSPACE/scripts/xiangshan.py --build          \
            --dramsim3 /nfs/home/share/ci-workloads/DRAMsim3              \
            --with-dramsim3 --threads 8                                   \
            --num-cores 1 --config DefaultMatrixConfig                    \
            --pgo $GITHUB_WORKSPACE/ready-to-run/coremark-2-iteration.bin \
            --llvm-profdata llvm-profdata --trace-fst
      - name: Save artifact
        run: |
          mkdir -p ${EMU_HOME}
          cp -L ${GITHUB_WORKSPACE}/build/emu ${EMU_HOME}/emu
          cp -L ${GITHUB_WORKSPACE}/ready-to-run/riscv64-nemu-interpreter-so ${EMU_HOME}/riscv64-nemu-interpreter-so

  nightly-checkpoints:
    runs-on: [bosc, node]
    needs: build-default-matrix
    continue-on-error: false
    timeout-minutes: 720
    name: Nightly Regression(master) - Checkpoints
    steps:
      - uses: actions/checkout@v7
      - name: Select random checkpoints
        id: select
        run: |
          RESULT_LIST=$(python3 $GITHUB_WORKSPACE/.github/workflows/ckpt_select.py \
            --output list \
            --seed ${{ github.run_number }} \
            --profile "${PROFILE_PATH}" \
            --eta-threshold "${ETA_THRESHOLD}" \
            --random ":${FUZZ_NUM}:${CKPT_BASE}/spec06_gcc16_rva23_novec_260820/json/checkpoints_all.json" \
            --random ":${FUZZ_NUM}:${CKPT_BASE}/spec17_rate_gcc16_rva23_novec_260904/json/checkpoints_all.json" \
          )
          SPEC_DIR="${NIGHTLY_HOME}/checkpoints"
          RESULT_PATH="${SPEC_DIR}/fuzz-$(date '+%y%m%d').f"
          mkdir -p "${SPEC_DIR}"
          echo "${RESULT_LIST}" > "${RESULT_PATH}"
          echo "RESULT_PATH=${RESULT_PATH}" >> "$GITHUB_OUTPUT"
          echo "SPEC_DIR=${SPEC_DIR}" >> "$GITHUB_ENV"
          echo "SCORE_FILE=${SPEC_DIR}/score.txt" >> "$GITHUB_ENV"
          echo "Selected checkpoints:"
          cat "${RESULT_PATH}"
      - name: Run SPEC CPU checkpoints
        run: |
          cd $SCRIPTS_HOME/perf_trigger
          python3 main.py \
            --json-path "${{ steps.select.outputs.RESULT_PATH }}" \
            --result-path "$SPEC_DIR" \
            --emu-path "$EMU_HOME/emu" \
            --threads 8 \
            --server-list "$SERVER_LIST" \
            --nemu-so-path "$EMU_HOME/riscv64-nemu-interpreter-so" \
            --run
      - name: Generate report
        run: |
          cd $SCRIPTS_HOME/perf_trigger
          python3 main.py \
            --json-path "${{ steps.select.outputs.RESULT_PATH }}" \
            --result-path "$SPEC_DIR" \
            --report \
            > "$SCORE_FILE"
      - name: Generate GitHub summary
        run: |
          echo "### :rocket: Performance Test Result" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$SCORE_FILE" >> $GITHUB_STEP_SUMMARY
          cat "$SCORE_FILE" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  emu-xsai-performance:
    runs-on: [bosc, node]
    needs: build-default-matrix
    continue-on-error: false
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        include:
          - benchmark: hmmer-Vector
            use_gcpt_restore_patch: false
            workloads: |
              /nfs/home/share/ci-workloads/hmmer-Vector/_6598_0.250135_.zstd
          - benchmark: gcpt-restore
            use_gcpt_restore_patch: true
            workloads: |
              /nfs/home/share/ci-workloads/mcf/_17520000000_.gz
              /nfs/home/share/ci-workloads/xalancbmk/_266100000000_.gz
              /nfs/home/share/ci-workloads/gcc/_39720000000_.gz
              /nfs/home/share/ci-workloads/namd/_434640000000_.gz
              /nfs/home/share/ci-workloads/milc/_103620000000_.gz
              /nfs/home/share/ci-workloads/lbm/_140840000000_.gz
              /nfs/home/share/ci-workloads/gromacs/_275480000000_.gz
              /nfs/home/share/ci-workloads/wrf/_1916220000000_.gz
              /nfs/home/share/ci-workloads/astar/_122060000000_.gz
    name: EMU - XSAI Performance - ${{ matrix.benchmark }}
    env:
      GCPT_RESTORE_BIN: /nfs/home/share/ci-workloads/fix-gcpt/gcpt.bin
    steps:
      - uses: actions/checkout@v7
      - name: Prepare workload list
        id: prepare
        env:
          WORKLOADS: ${{ matrix.workloads }}
        run: |
          SPEC_DIR="${NIGHTLY_HOME}/performance/${{ matrix.benchmark }}"
          RESULT_PATH="${SPEC_DIR}/workloads.f"
          mkdir -p "${SPEC_DIR}"
          printf '%s\n' "$WORKLOADS" > "${RESULT_PATH}"
          echo "RESULT_PATH=${RESULT_PATH}" >> "$GITHUB_OUTPUT"
          echo "SPEC_DIR=${SPEC_DIR}" >> "$GITHUB_ENV"
          echo "SCORE_FILE=${SPEC_DIR}/score.txt" >> "$GITHUB_ENV"
          echo "EMU_PATH=$EMU_HOME/emu" >> "$GITHUB_ENV"
          cat "${RESULT_PATH}"
      - name: Preserve checkpoint restore override
        if: ${{ matrix.use_gcpt_restore_patch }}
        run: |
          cat > "$SPEC_DIR/emu-gcpt-restore" <<EOF
          #!/bin/bash
          exec -a "\$0" "$EMU_HOME/emu" -r "$GCPT_RESTORE_BIN" "\$@"
          EOF
          chmod +x "$SPEC_DIR/emu-gcpt-restore"
          echo "EMU_PATH=$SPEC_DIR/emu-gcpt-restore" >> "$GITHUB_ENV"
      - name: Run SPEC CPU checkpoints
        run: |
          cd $SCRIPTS_HOME/perf_trigger
          python3 main.py \
            --json-path "${{ steps.prepare.outputs.RESULT_PATH }}" \
            --result-path "$SPEC_DIR" \
            --emu-path "$EMU_PATH" \
            --threads 8 --warmup 0 --max-instr 5000000 \
            --server-list "$SERVER_LIST" \
            --nemu-so-path "$EMU_HOME/riscv64-nemu-interpreter-so" \
            --dump-db \
            --run
      - name: Generate report
        run: |
          cd $SCRIPTS_HOME/perf_trigger
          python3 main.py \
            --json-path "${{ steps.prepare.outputs.RESULT_PATH }}" \
            --result-path "$SPEC_DIR" \
            --report \
            > "$SCORE_FILE"

  emu-xsai-performance-summary:
    runs-on: [bosc, node]
    needs:
      - build-default-matrix
      - emu-xsai-performance
    if: ${{ always() && needs.build-default-matrix.result == 'success' }}
    timeout-minutes: 30
    name: EMU - XSAI Performance Summary
    steps:
      - name: Generate summary
        run: |
          echo "### :rocket: Performance Test Result" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$NIGHTLY_HOME/performance/hmmer-Vector/score.txt" \
            "$NIGHTLY_HOME/performance/gcpt-restore/score.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  emu-no-matrix:
    runs-on: bosc
    continue-on-error: false
    timeout-minutes: 600
    name: EMU - XS without Matrix
    steps:
      - name: Cleanup orphan EMU
        run: |
          pkill -9 -e -f "${GITHUB_WORKSPACE}/build/emu" || true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: set env
        run: |
          JOB_HOME="${NIGHTLY_HOME}/no-matrix"
          echo "NOOP_HOME=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "NEMU_HOME=/nfs/home/share/ci-workloads/NEMU" >> $GITHUB_ENV
          echo "AM_HOME=/nfs/home/share/ci-workloads/nexus-am" >> $GITHUB_ENV
          echo "PERF_HOME=${JOB_HOME}" >> $GITHUB_ENV
          echo "WAVE_HOME=${JOB_HOME}" >> $GITHUB_ENV
          echo "GCPT_RESTORE_BIN=/nfs/home/share/ci-workloads/fix-gcpt/gcpt.bin" >> $GITHUB_ENV
          mkdir -p "${JOB_HOME}"
      - name: Initialize submodules
        run: make init-force
      - name: clean up
        run: |
          python3 $GITHUB_WORKSPACE/scripts/xiangshan.py --clean
      - name: Build EMU
        run: |
          sed -i \
            -e 's/--output-split 30000/--output-split 5000/' \
            -e 's/--output-split-cfuncs 30000/--output-split-cfuncs 5000/' \
            $GITHUB_WORKSPACE/difftest/verilator.mk
          python3 $GITHUB_WORKSPACE/scripts/xiangshan.py --build \
            --config DefaultConfig \
            --dramsim3 /nfs/home/share/ci-workloads/DRAMsim3 --with-dramsim3 --threads 8 \
            --pgo $GITHUB_WORKSPACE/ready-to-run/coremark-2-iteration.bin --llvm-profdata llvm-profdata --trace-fst
      - name: Simple Test - CoreMark
        id: coremark
        shell: bash
        run: |
          python3 $GITHUB_WORKSPACE/scripts/xiangshan.py --wave-dump $WAVE_HOME --threads 16 --numa --ci coremark 2> perf.log | tee stdout.log
          echo "IPC=$(grep -oP 'IPC = \K\d+\.\d+' stdout.log)" >> $GITHUB_OUTPUT
      - name: Archive log - coremark
        if: ${{ always() && steps.coremark.outcome != 'skipped' }}
        run: |
          if [[ "${{ steps.coremark.outcome }}" == "failure" ]]; then
            cat perf.log
          else
            mv perf.log perf.log.raw
            cat perf.log.raw | sort | tee perf.log
          fi
          tar -czvf "$WAVE_HOME/coremark.tar.gz" stdout.log perf.log

      - name: System Test - Linux
        id: linux
        shell: bash
        run: |
          python3 $GITHUB_WORKSPACE/scripts/xiangshan.py --wave-dump $WAVE_HOME --threads 16 --numa --ci linux-hello-opensbi 2> perf.log | tee stdout.log
          echo "IPC=$(grep -oP 'IPC = \K\d+\.\d+' stdout.log)" >> $GITHUB_OUTPUT
      - name: Archive log - linux
        if: ${{ always() && steps.linux.outcome != 'skipped' }}
        run: |
          if [[ "${{ steps.linux.outcome }}" == "failure" ]]; then
            cat perf.log
          else
            mv perf.log perf.log.raw
            cat perf.log.raw | sort | tee perf.log
          fi
          tar -czvf "$WAVE_HOME/linux.tar.gz" stdout.log perf.log
